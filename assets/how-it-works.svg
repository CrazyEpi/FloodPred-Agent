<text x="60" y="52" fill="#172b4d" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="start" dominant-baseline="central">FloodPred Agent</text>
<text x="60" y="91" fill="#52647e" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">Conversation-first. Evidence-grounded. Bounded by design.</text>
